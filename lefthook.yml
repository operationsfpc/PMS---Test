# Local quality gates. See CONTRIBUTING.md.
#
# Install after every fresh clone:  pnpm lefthook install
# Emergency bypass (say so in the PR): git commit --no-verify / git push --no-verify

pre-commit:
  parallel: true
  jobs:
    - name: biome (format + lint staged)
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

# ~3 min. Deliberately NOT `pnpm test:cov`: coverage instrumentation doubles the
# run to ~6 min, and it collides with a `pnpm test` watcher running in another
# window (both write to coverage/.tmp). Coverage gates are enforced by CI and by
# `pnpm check` before you open the PR.
pre-push:
  parallel: false
  jobs:
    - name: typecheck
      run: pnpm typecheck

    - name: tests
      run: pnpm test:run
